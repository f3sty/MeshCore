[Waveshare_S3_LR1121_XF1]
extends = esp32_base
board = esp32-s3-devkitc-1
; The module has 4 MB flash; the DevKit board defaults to an 8 MB layout.
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ENV_INCLUDE_GPS=1
  -I variants/waveshare-s3-lr1121-xf1
  -D WAVESHARE_S3_LR1121_XF1
  -D P_LORA_NSS=42
  -D P_LORA_SCLK=40
  -D P_LORA_MOSI=45
  -D P_LORA_MISO=46
  -D P_LORA_RESET=39
  -D P_LORA_BUSY=41
  -D P_LORA_DIO_1=38
  -D RADIO_CLASS=WaveshareLR1121
  -D WRAPPER_CLASS=WaveshareLR1121Wrapper
  -D LORA_TX_POWER=22
  -D RX_BOOSTED_GAIN=1
  -D MIN_NOISE_FLOOR_DBM=-127
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/waveshare-s3-lr1121-xf1>
lib_deps =
  ${esp32_base.lib_deps}
  ${esp32_ota.lib_deps}

[env:Waveshare_S3_LR1121_XF1_kiss_modem]
extends = Waveshare_S3_LR1121_XF1
build_src_filter = ${Waveshare_S3_LR1121_XF1.build_src_filter}
  +<../examples/kiss_modem/>

[env:Waveshare_S3_LR1121_XF1_kiss_modem_wifi]
extends = env:Waveshare_S3_LR1121_XF1_kiss_modem
build_flags =
  ${Waveshare_S3_LR1121_XF1.build_flags}
  -D KISS_WIFI
  -D KISS_WIFI_PORT=27027
  -D WIFI_SSID='"YOUR_WIFI_SSID"'
  -D WIFI_PWD='"YOUR_WIFI_PASSWORD"'

[env:Waveshare_S3_LR1121_XF1_repeater]
extends = Waveshare_S3_LR1121_XF1
build_flags =
  ${Waveshare_S3_LR1121_XF1.build_flags}
  -D ADVERT_NAME='"Waveshare S3 LR1121 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Waveshare_S3_LR1121_XF1.build_src_filter}
  +<../examples/simple_repeater>

[env:Waveshare_S3_LR1121_XF1_terminal_chat]
extends = Waveshare_S3_LR1121_XF1
build_flags =
  ${Waveshare_S3_LR1121_XF1.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
build_src_filter = ${Waveshare_S3_LR1121_XF1.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${Waveshare_S3_LR1121_XF1.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Waveshare_S3_LR1121_XF1_room_server]
extends = Waveshare_S3_LR1121_XF1
build_flags =
  ${Waveshare_S3_LR1121_XF1.build_flags}
  -D ADVERT_NAME='"Waveshare S3 LR1121 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${Waveshare_S3_LR1121_XF1.build_src_filter}
  +<../examples/simple_room_server>

[env:Waveshare_S3_LR1121_XF1_companion_radio_usb]
extends = Waveshare_S3_LR1121_XF1
build_flags =
  ${Waveshare_S3_LR1121_XF1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
build_src_filter = ${Waveshare_S3_LR1121_XF1.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121_XF1.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Waveshare_S3_LR1121_XF1_companion_radio_ble]
extends = Waveshare_S3_LR1121_XF1
build_flags =
  ${Waveshare_S3_LR1121_XF1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Waveshare_S3_LR1121_XF1.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121_XF1.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Waveshare_S3_LR1121_XF1_companion_radio_wifi]
extends = Waveshare_S3_LR1121_XF1
build_flags =
  ${Waveshare_S3_LR1121_XF1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
build_src_filter = ${Waveshare_S3_LR1121_XF1.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121_XF1.lib_deps}
  densaugeo/base64 @ ~1.4.0
