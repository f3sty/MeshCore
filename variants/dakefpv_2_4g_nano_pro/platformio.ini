[env:DakeFPV_2_4G_Nano_Pro_kiss_modem]
extends = DakeFPV_2_4G_Nano_Pro
build_src_filter = ${DakeFPV_2_4G_Nano_Pro.build_src_filter}
  +<../examples/kiss_modem/>

[env:DakeFPV_2_4G_Nano_Pro_kiss_modem_wifi]
extends = env:DakeFPV_2_4G_Nano_Pro_kiss_modem
build_flags =
  ${DakeFPV_2_4G_Nano_Pro.build_flags}
  -D KISS_WIFI
  -D KISS_WIFI_PORT=27027
  -D WIFI_SSID='"YOUR_WIFI_SSID"'
  -D WIFI_PWD='"YOUR_WIFI_PASSWORD"'
