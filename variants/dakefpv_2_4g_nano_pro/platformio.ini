[DakeFPV_2_4G_Nano_Pro]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = variants/dakefpv_2_4g_nano_pro/partitions.csv
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
build_flags =
  ${esp32_base.build_flags}
  -I variants/dakefpv_2_4g_nano_pro
  ; Serial uses UART0 on the ELRS RX/TX pads (GPIO20/GPIO21).
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ESP32_CPU_FREQ=80
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D RADIO_CLASS=DakeLR1121
  -D WRAPPER_CLASS=DakeLR1121Wrapper
  ; Uncomment to enable the GPIO8 GRB packet LED for all firmware roles.
  -D DAKE_RGB_PACKET_LED=1
  -D DAKE_RGB_LED_BRIGHTNESS=16
  ; Settings and preferences represent nominal board output in dBm.
  -D LORA_TX_POWER_PROFILE=1
  -D LORA_TX_POWER=30
  -D MIN_LORA_TX_POWER=14
  -D MAX_LORA_TX_POWER=30
  -D LORA_FREQ=2483.0
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
  -D RX_BOOSTED_GAIN=1
  ; Raw LR1121 RSSI reaches -127.5 dBm
  -D MIN_NOISE_FLOOR_DBM=-127
  -D P_LORA_DIO_1=1
  -D P_LORA_BUSY=3
  -D P_LORA_NSS=7
  -D P_LORA_RESET=2
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=4
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/dakefpv_2_4g_nano_pro>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}

[env:DakeFPV_2_4G_Nano_Pro_repeater]
extends = DakeFPV_2_4G_Nano_Pro
build_src_filter = ${DakeFPV_2_4G_Nano_Pro.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${DakeFPV_2_4G_Nano_Pro.build_flags}
  -D ADVERT_NAME='"DakeFPV 2.4G Nano Pro Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=75
 ; -D MESH_PACKET_LOGGING=1
 ; -D MESH_DEBUG=1
lib_deps =
  ${DakeFPV_2_4G_Nano_Pro.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:DakeFPV_2_4G_Nano_Pro_room_server]
extends = DakeFPV_2_4G_Nano_Pro
build_src_filter = ${DakeFPV_2_4G_Nano_Pro.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${DakeFPV_2_4G_Nano_Pro.build_flags}
  -D ADVERT_NAME='"DakeFPV 2.4G Nano Pro Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${DakeFPV_2_4G_Nano_Pro.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:DakeFPV_2_4G_Nano_Pro_companion_radio_ble]
extends = DakeFPV_2_4G_Nano_Pro
build_src_filter = ${DakeFPV_2_4G_Nano_Pro.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${DakeFPV_2_4G_Nano_Pro.build_flags}
  -D MAX_CONTACTS=500
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  ; -D BLE_DEBUG_LOGGING=1
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
lib_deps =
  ${DakeFPV_2_4G_Nano_Pro.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:DakeFPV_2_4G_Nano_Pro_companion_radio_usb]
extends = DakeFPV_2_4G_Nano_Pro
